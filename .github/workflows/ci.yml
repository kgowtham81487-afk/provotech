name: EES CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build, Lint & Test Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        run: pnpm prisma validate
        env:
          DATABASE_URL: postgresql://localhost:5432/provotech?schema=public

      - name: Run Type Checking
        run: pnpm typecheck

      - name: Execute Automated Tests
        run: pnpm test

      - name: Build Shared Package
        run: pnpm build:shared

      - name: Build API Backend
        run: pnpm build:api

      - name: Build Web Frontend
        run: pnpm build:web
        env:
          NEXT_PUBLIC_APP_URL: https://ees.provolution.com
          NEXT_PUBLIC_API_URL: https://ees-api.onrender.com/api/v1
